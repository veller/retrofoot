# RetroFoot API - Cloudflare Workers Configuration
# Must match your RetroFoot team account (dashboard → Workers & Pages → Account details)
account_id = "9b3083c4a6b8f195ea446d884a6523e4"

name = "retrofoot-api"
main = "src/index.ts"
compatibility_date = "2025-01-13"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Development settings
[dev]
port = 8787

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "retrofoot-db"
database_id = "bca95b94-1528-42fb-9de4-09a61ea76754"
migrations_dir = "../../packages/db/migrations"

[[durable_objects.bindings]]
name = "MATCH_ROOM"
class_name = "MatchRoom"

[[migrations]]
tag = "online-match-room-v1"
new_sqlite_classes = ["MatchRoom"]

# Environment variables (secrets should be set via `wrangler secret put`)
[vars]
ENVIRONMENT = "production"
API_BASE_URL = "https://retrofoot-api.vellerbauer.workers.dev"
ALLOWED_ORIGINS = "https://retrofoot-web.pages.dev"
# Optional: comma-separated admin emails for /api/admin (defaults are set in code if unset)
# ADMIN_EMAILS = "you@example.com,other@example.com"

# Development secrets and overrides (use .dev.vars file for local dev)
# The .dev.vars file overrides [vars] during `wrangler dev`
# Create a .dev.vars file with:
# BETTER_AUTH_SECRET=your-secret-at-least-32-characters-long
# ENVIRONMENT=development
# Optional (see docs/LOCAL_ONLINE_DEV.md):
# ONLINE_DEV_SINGLE_PLAYER_MATCH=1
# ONLINE_DEV_SECRET=long-random-string-for-dev-routes-only
